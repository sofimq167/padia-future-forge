services:
  padia-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:80"
    # production image serves built static files via nginx
    restart: unless-stopped
    environment:
      - NODE_ENV=production



# Usage examples:
#   docker compose up padia-dev   # start dev server (access via localhost:5173)
#   docker compose up padia-app   # build+run production image (localhost:3002)
#   docker compose up             # start both services
