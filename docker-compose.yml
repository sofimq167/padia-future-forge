services:
  padia-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:80"
    # (No bind mounts) The image will contain built assets including public/gato.png
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    # Uncomment if you want to mount local files for development
    # volumes:
    #   - ./src:/app/src
    #   - ./public:/app/public