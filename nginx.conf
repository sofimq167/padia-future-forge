server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Serve the app under /padia/ and fallback to the SPA index for client-side routes
  location /padia/ {
    try_files $uri $uri/ /padia/index.html;
  }

  # Optional: efficient caching for static assets
  location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Default deny for other paths (keeps default nginx behavior)
}
